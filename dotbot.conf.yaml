- defaults:
    link:
      relink: true

- clean: ['~']

- create:
  - ~/.local
  - ~/.config

- link:
    ~/.local/bin: bin
    ~/.vim: vim
    ~/.vimrc: vimrc
    #~/.profile:
    ~/.profile.d:
    ~/.bashrc.d:
    ~/.gitconfig:
    ~/.config/nvim: nvim
    ~/.config/terminator: terminator
    ~/.config/tmux: tmux
    ~/.config/i3: i3
    ~/.config/i3status: i3status
    ~/.config/oh_my_zsh: oh_my_zsh
    ~/.xprofile:
    ~/.zprofile:
    ~/.zshrc:

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  -
    description: Patch .bashrc file
    command: |
      if fgrep -q '.bashrc.d' ${HOME}/.bashrc
      then
          echo "Bash profile already added."
      else
          cat bashrc.include >> ${HOME}/.bashrc
          echo "Bash profile source added."
      fi
    stdout: true
    quiet: true
  -
    description: Install antigen
    command: |
      if [ ! -f antigen/antigen.zsh ]
      then
        curl -L git.io/antigen > oh_my_zsh/antigen/antigen.zsh
      fi
    stdout: true
    quiet: true

