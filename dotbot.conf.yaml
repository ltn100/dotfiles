- defaults:
    link:
      relink: true

- clean: ['~']

- create:
  - ~/.local
  - ~/.config

- link:
    ~/.local/bin: bin
    ~/.vim: vim
    ~/.vimrc: vimrc
    #~/.profile:
    #~/.profile.d:
    #~/.bashrc.d:
    ~/.gitconfig:
    ~/.config/nvim: nvim
    ~/.config/terminator: terminator
    ~/.config/tmux: tmux
    ~/.config/i3: i3
    ~/.config/i3status: i3status
    ~/.config/oh_my_zsh: oh_my_zsh
    ~/.config/ghostty: ghostty
    ~/.xprofile:
    ~/.zprofile:
    ~/.zshrc:
    ~/.zsh_plugins.txt:
    ~/.config/Code/User/settings.json:
      path: vscode/settings.json
      create: true
      if: '[ "$(uname)" = "Linux" ]'

    ~/Library/Application Support/Code/User/settings.json:
      path: vscode/settings.json
      create: true
      if: '[ "$(uname)" = "Darwin" ]'
    ~/.config/Code/User/keybindings.json:
      path: vscode/keybindings.json
      create: true
      if: '[ "$(uname)" = "Linux" ]'

    ~/Library/Application Support/Code/User/keybindings.json:
      path: vscode/keybindings.json
      create: true
      if: '[ "$(uname)" = "Darwin" ]'

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  -
    description: Patch .bashrc file
    command: |
      if fgrep -q '.bashrc.d' ${HOME}/.bashrc
      then
          echo "Bash profile already added."
      else
          cat bashrc.include >> ${HOME}/.bashrc
          echo "Bash profile source added."
      fi
    stdout: true
    quiet: true
  -
    description: Install antidote
    command: |
      if [ ! -d ${ZDOTDIR:-~}/.antidote ]
      then
        git clone --depth=1 https://github.com/mattmc3/antidote.git ${ZDOTDIR:-~}/.antidote
      fi
    stdout: true
    quiet: true
  -
    description: Installing VS Code extensions
    command: 'cat vscode/extensions.txt | xargs -L 1 code --install-extension'
    if: 'command -v code >/dev/null 2>&1'
    stderr: true
